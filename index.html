const steps=[['e-bell','e-chicken','e-friar'],['s-bell','s-friar','s-garden','s-artisans'],['j-bell','j-wheel','j-oven','j-boy'],['c-bell','c-horses','c-men','c-boy']];
const visited=steps.map(()=>new Set());let page=1,active=false,jFriar=false,cFriar=false,cFriarMessageOpen=false,jFriarMessageOpen=false,alamoCannon=false,alamoFlag=false,alamoFlagMessageOpen=false,completed=false;
const $=id=>document.getElementById(id),pause=ms=>new Promise(r=>setTimeout(r,ms));
function popup(id){const [title,body]=content[id];$('pop-title').textContent=title;$('pop-text').textContent=body;$('popup').hidden=false;}
function ready(id){$(id).classList.remove('locked');$(id).classList.add('ready');}
function update(){let v=visited[page-1];if(!v){$('status').style.display='block';$('count').textContent=`${Number(alamoCannon)+Number(alamoFlag)} of 2`; $('instruction').textContent='';return;}$('status').style.display='block';$('count').textContent=`${v.size} of ${steps[page-1].length}`;let msg='';if(page===1)msg=v.size===3?'The church door glows. Click it to continue.':'Find the bell, chicken, and friar.';if(page===2)msg=v.size===4?'The church door glows. Click it to continue.':'Find the bell, friar, gardener, and artisans.';if(page===3)msg=jFriar?'The church door glows. Click it to continue.':v.size===4?'A final voice is ready to speak.':'Explore the courtyard.';if(page===4)msg=cFriar?'The church door glows. Click it to continue.':cFriarMessageOpen?'Read the counsel, then continue.':v.size===4?'A final voice is ready to speak.':'Explore the courtyard.';$('instruction').textContent=msg;}
function discover(id,p){if(active)return;visited[p-1].add(id);$(id).classList.add('done');popup(id);if(p===1&&visited[0].size===3)ready('e-door');if(p===2&&visited[1].size===4)ready('s-door');if(p===3&&visited[2].size===4)ready('j-friar');if(p===4&&visited[3].size===4)ready('c-friar');update();}
steps.forEach((ids,i)=>ids.forEach(id=>$(id).addEventListener('click',()=>discover(id,i+1))));
$('j-friar').onclick=()=>{if(visited[2].size!==4||active)return;jFriarMessageOpen=true;popup('j-friar');$('j-friar').classList.add('done');$('j-friar').classList.remove('ready');update()};
$('c-friar').onclick=()=>{if(visited[3].size!==4||active||cFriar)return;cFriarMessageOpen=true;popup('c-friar');$('c-friar').classList.add('done');$('c-friar').classList.remove('ready');$('c-friar').classList.add('locked');update()};
function dismissPopup(){
 if($('popup').hidden)return;
 const wasFriar=cFriarMessageOpen,wasJose=jFriarMessageOpen,wasFlag=alamoFlagMessageOpen;
 $('popup').hidden=true;
 if(wasJose){jFriarMessageOpen=false;jFriar=true;ready('j-door');}
 if(wasFriar){cFriarMessageOpen=false;cFriar=true;ready('c-door');}
 if(wasFlag&&!completed){alamoFlagMessageOpen=false;completed=true;showCompletion();}
 update();
}
function showCompletion(){
 const el=$('completion');el.hidden=false;
 requestAnimationFrame(()=>el.classList.add('visible'));
 setTimeout(()=>el.classList.add('dim'),8000);
}$('close').onclick=dismissPopup;document.addEventListener('keydown',e=>{if(e.key==='Escape')dismissPopup()});
const headings=['','Whispers of Mission Espada','Whispers of Mission San Juan','Whispers of Mission San José','Whispers of Mission Concepción','The Alamo: The Final Whisper'];
function setPage(n){$('page'+page).hidden=true;page=n;$('page'+page).hidden=false;$('heading').textContent=headings[n];$('subtitle').textContent=n===5?'One final discovery awaits.':n===4?'Discover four stories before speaking with the friar.':n===3?'Discover four stories before speaking with the friar.':n===2?'Explore four voices of San Juan.':'Three voices hold the key to the next chapter.';update()}
function makeTransition(type){const t=$('transition');t.innerHTML='';if(type==='shutters'){for(let i=0;i<8;i++){let el=document.createElement('div');el.className='shutter-slat';el.style.left=(i*12.5)+'%';el.style.transitionDelay=(i*55)+'ms';t.append(el)}}else if(type==='burlap'){for(const side of ['left','right']){let el=document.createElement('div');el.className='burlap-half '+side;t.append(el)}}else if(type==='clouds'){for(let i=0;i<5;i++){let el=document.createElement('div');el.className='cloud';el.style.left=(i*20-5)+'%';el.style.transitionDelay=(i*110)+'ms';t.append(el)}let curtain=document.createElement('div');curtain.className='cloud-cover';t.append(curtain)}else{for(let i=0;i<42;i++){let el=document.createElement('div');el.className='rock';el.style.left=(i%14*7.4-3)+'%';el.style.width=(9+i%4*3)+'%';el.style.height=(22+i%5*4)+'%';el.style.transitionDelay=(i%7*85)+'ms';t.append(el)}let curtain=document.createElement('div');curtain.className='rock-curtain';t.append(curtain)}return t}
async function transition(type,next){if(active)return;active=true;$('popup').hidden=true;const t=makeTransition(type);t.className='transition active';await pause(30);t.classList.add('closing');if(type==='rocks'){await pause(550);t.classList.add('cover');await pause(500)}else if(type==='clouds'){await pause(1100);t.classList.add('cover');await pause(500)}else await pause(1150);setPage(next);t.classList.remove('closing');t.classList.add('opening');await pause(type==='rocks'?650:type==='clouds'?1700:1100);t.className='transition';active=false;}
$('e-door').onclick=()=>{if(visited[0].size===3)transition('shutters',2)};
$('s-door').onclick=()=>{if(visited[1].size===4)transition('burlap',3)};
$('j-door').onclick=()=>{if(jFriar)transition('rocks',4)};
$('c-door').onclick=()=>{if(cFriar)transition('clouds',5)};
$('a-cannon').onclick=()=>{if(active)return;alamoCannon=true;$('a-cannon').classList.add('done');popup('a-cannon');ready('a-flag');update();};
$('a-flag').onclick=()=>{if(active||!alamoCannon)return;alamoFlag=true;alamoFlagMessageOpen=true;$('a-flag').classList.add('done');popup('a-flag');update();};
</script></body></html>
